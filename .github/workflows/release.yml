name: Release APK

# Push a tag like v1.2.3 → tests → signed release APK → SHA-256 → GitHub Release.
# Required repository secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.1
          python -m pytest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PappVersion=${GITHUB_REF_NAME#v} --console=plain

      - name: Verify signature and checksum
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APK=second-brain-$VERSION.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -3
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --pretty='- %s' ${PREV:+$PREV..}"$GITHUB_REF_NAME" > notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "second-brain-$VERSION.apk" "second-brain-$VERSION.apk.sha256" \
            --title "Второй мозг $VERSION" --notes-file notes.md
