# nginx site for the API. Matches the host's existing layout: port 443 is owned by an nginx
# `stream` SNI router that forwards everything not destined for the VPN to 127.0.0.1:4443 with
# PROXY protocol, so this server block listens there (real client IP via real_ip_header).
# Replace brain.quasar-x.ru if you deploy under another name.

limit_req_zone $binary_remote_addr zone=brain_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name brain.quasar-x.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    # No http2 here: on nginx 1.24 it is a property of the shared 127.0.0.1:4443 socket and would
    # silently change every other site behind the SNI router.
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name brain.quasar-x.ru;

    ssl_certificate     /etc/letsencrypt/live/brain.quasar-x.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.quasar-x.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1100m;   # Telegram / AI-service archives
    client_body_timeout 300s;

    location /api/v1/chat/conversations/ {
        limit_req zone=brain_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        limit_req zone=brain_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
